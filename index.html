<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        position: relative;
        top: 0;
        left: 0;
        background-color: coral;
        height: 100vh;
        width: 100%;
        animation: changeContainer 1s infinite;
      }
      p {
        position: absolute;
        left: 15%;
        font-size: 50px;
        text-align: center;
        color: pink;
        animation-name: changeText;
        animation-duration: 1s;
        animation-iteration-count: infinite;
      }
      .heart {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: auto;
        width: 150px;
        height: 150px;
        background-color: pink;
        transform: rotate(-45deg);
        animation-name: heartBeat;
        animation-duration: 1s;
        animation-iteration-count: infinite;
      }

      .heart:before {
        content: "";
        position: absolute;
        left: 0;
        top: -85px;
        width: 150px;
        height: 150px;
        background-color: pink;
        border-radius: 50%;
      }
      .heart:after {
        content: "";
        position: absolute;
        top: 0;
        left: 85px;
        width: 150px;
        height: 150px;
        background-color: pink;
        border-radius: 50%;
      }

      @keyframes changeContainer {
        50% {
          background-color: lightCoral;
        }
      }

      @keyframes changeText {
        50% {
          color: white;
        }
      }

      @keyframes heartBeat {
        50% {
          transform: scale(1.5) rotate(-45deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p>Hello nhi ba tui</p>
    </div>
    <div class="heart"></div>
  </body>
</html>
